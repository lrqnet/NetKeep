name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  netkeep-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/lrqnet/netkeep
            docker.io/lrqnet/netkeep
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NETKEEP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=netkeep
          cache-to: type=gha,mode=max,scope=netkeep
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      - name: Sign NetKeep image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/lrqnet/netkeep@${DIGEST}"
          cosign sign --yes "docker.io/lrqnet/netkeep@${DIGEST}"

  oxidized-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/lrqnet/netkeep-oxidized
            docker.io/lrqnet/netkeep-oxidized
          tags: type=raw,value=0.37.0-r1
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.oxidized
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=netkeep-oxidized
          cache-to: type=gha,mode=max,scope=netkeep-oxidized
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      - name: Sign NetKeep Oxidized image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/lrqnet/netkeep-oxidized@${DIGEST}"
          cosign sign --yes "docker.io/lrqnet/netkeep-oxidized@${DIGEST}"

  release-compose:
    needs:
      - netkeep-image
      - oxidized-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Create digest-pinned release Compose
        env:
          APP_DIGEST: ${{ needs.netkeep-image.outputs.digest }}
          OXIDIZED_DIGEST: ${{ needs.oxidized-image.outputs.digest }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "v$(sed -n 's/.*netkeep:\([0-9][0-9.]*\).*/\1/p' compose.yaml | head -1)" = "${GITHUB_REF_NAME}"
          mkdir -p dist
          sed \
            -e "s#docker.io/lrqnet/netkeep:${VERSION}#docker.io/lrqnet/netkeep@${APP_DIGEST}#g" \
            -e "s#docker.io/lrqnet/netkeep-oxidized:0.37.0-r1#docker.io/lrqnet/netkeep-oxidized@${OXIDIZED_DIGEST}#g" \
            compose.yaml > dist/compose.yaml
          grep -q "docker.io/lrqnet/netkeep@sha256:" dist/compose.yaml
          grep -q "docker.io/lrqnet/netkeep-oxidized@sha256:" dist/compose.yaml
          docker compose -f dist/compose.yaml config --quiet
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            dist/compose.yaml
            THIRD_PARTY_NOTICES
