name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Composer advisory report
        continue-on-error: true
        run: composer audit --locked --no-interaction
      - name: npm advisory report
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trivy-filesystem-sarif
          path: trivy-results.sarif
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          output: trivy-secrets.txt
          exit-code: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trivy-secrets
          path: trivy-secrets.txt
          if-no-files-found: warn

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: netkeep
            build: docker build --target production -t netkeep:scan .
            image: netkeep:scan
          - name: netkeep-oxidized
            build: docker build -f Dockerfile.oxidized -t netkeep-oxidized:scan .
            image: netkeep-oxidized:scan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ matrix.image }}
          format: table
          output: trivy-${{ matrix.name }}.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.txt
          if-no-files-found: warn
