name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Composer advisory report
        continue-on-error: true
        run: composer audit --locked --no-interaction
      - name: npm advisory report
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trivy-filesystem-sarif
          path: trivy-results.sarif
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          output: trivy-secrets.txt
          exit-code: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trivy-secrets
          path: trivy-secrets.txt
          if-no-files-found: warn

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: netkeep
            build: docker build --target production -t netkeep:scan .
            image: netkeep:scan
          - name: netkeep-oxidized
            build: docker build -f Dockerfile.oxidized -t netkeep-oxidized:scan .
            image: netkeep-oxidized:scan
          - name: netkeep-updater
            build: docker build -f Dockerfile.updater -t netkeep-updater:scan .
            image: netkeep-updater:scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}
          format: table
          output: trivy-${{ matrix.name }}.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.txt
          if-no-files-found: warn
