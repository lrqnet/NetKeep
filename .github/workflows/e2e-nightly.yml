name: e2e-nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  complete-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NETKEEP_R2_TESTS: ${{ secrets.NETKEEP_R2_ENDPOINT != '' && 'true' || 'false' }}
      NETKEEP_R2_ENDPOINT: ${{ secrets.NETKEEP_R2_ENDPOINT }}
      NETKEEP_R2_BUCKET: ${{ secrets.NETKEEP_R2_BUCKET }}
      NETKEEP_R2_ACCESS_KEY: ${{ secrets.NETKEEP_R2_ACCESS_KEY }}
      NETKEEP_R2_SECRET_KEY: ${{ secrets.NETKEEP_R2_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run complete journey
        run: ./scripts/e2e-test.sh all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playwright-complete
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose -p netkeep-e2e -f compose.yaml -f compose.dev.yaml -f compose.e2e.yaml logs --no-color
      - name: Stop installation
        if: always()
        run: docker compose -p netkeep-e2e -f compose.yaml -f compose.dev.yaml -f compose.e2e.yaml down --volumes --remove-orphans
